# The HDRIs' library-wide settings (Phase14, Q-P14-5). The HDRIs themselves are the files in
# MatterLibrary/hdris/, each with its record in library/provenance/sources/hdris/.
#
# default: the HDRI a new scene starts with (A3). Named once, here: the dev install
# (tools/releases/serve_to_stage.py) writes it as the catalog's `default_hdri`, and a release
# lockfile carries it as `default_hdri`. It is the sky every scene used before the library held
# HDRIs, byte-identical to it (Phase14 14.1), so no scene's look changes.
default: IndustrialSunset02_PureSky
#
# published_drop_variant: the Variant token every PUBLISHED name drops (RD-LBL-5, the lead
# 2026-10-16: "We don't need to reanme the source files... but yes - we need to rename the others
# that are published"). The files above keep their names, as do their records and `default`
# (both name the source); the catalog id, the served file, the header's MATTER_ID, the thumbnail
# and the site file take the published name (AristeaWreck_PureSky_v01 -> AristeaWreck_v01).
# SET 2026-10-16 (Phase20 20.2). Was: unset until a cutover day shared with the platform
# (Q-LBL-5 (a)). The old names (…_PureSky_v01.hdr) were kept resolving, hidden, until 2026-10-30;
# no longer: nothing had been released, and each was a second copy of its sky in every Build.
published_drop_variant: PureSky
