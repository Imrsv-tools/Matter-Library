# Matter Library — matterlib-0.0.1 PILOT manifest (Phase 53)
#
# Proves the Contract/Manifest.md lockfile schema with a real artifact for Phase 56.
# All 7 proof articles are pinned at status: draft — Phase 53 does only INFORMAL visual
# parity; the formal ΔE bar (and promotion to candidate/approved) is Phase 56/60. NEVER
# approved here. This is NOT the live runtime catalog (the flat-scan -> manifest cutover is
# Phase 56).
#
# Pilot conventions (flagged for Phase 56, which owns the manifest cutover):
#   * `id` = Domain/Class path + the qualified name INCLUDING the scale tag, so `id`+`version`
#     resolves to a file (<id>_<version>.mtlx). Manifest.md's example drops the sNN tag from
#     `id`, which is underspecified for file resolution — the pilot keeps it.
#   * IMRSV_MissingMaterial is the off-grammar system material (no _vNN in its filename); it
#     resolves by bare <id>.mtlx and carries a nominal version: v01.
