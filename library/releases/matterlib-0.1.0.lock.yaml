# Matter Library — matterlib-0.1.0 OFFICIAL release manifest (Phase 60)
#
# The first officially-promoted release. The 0.0.1 pilot (Phase 53) is retained as history and
# was NEVER approved; this file is the promotion target. Phase 60.5 records auditable pixel
# provenance for every texture and flips the full set draft -> candidate. The candidate -> approved
# flip + the release tag are the terminal Phase-60.10 step, gated on parity (60.6) + regression
# tests (60.7) + the deployed-path delivery gate (60.8) — nothing reaches approved before then.
#
# Provenance (RD-Provenance, vendor-neutral auditable policy; Adobe excluded): every texture is
# clean — ambientCG CC0 or IMRSV procedural (deterministic value-noise). Full record + evidence:
# library/provenance/matterlib-0.1.0-textures.md.
#
# `id` = Domain/Class path + qualified name incl. the sNN scale tag, so `id`+`version` resolves to
# <id>_<version>.mtlx. IMRSV_MissingMaterial is off-grammar (bare <id>.mtlx), nominal version v01.
