; The group the runtime puts every texture it loads in (MatterRuntimeGameMode::LoadTexture):
; anisotropic, with LINEAR mip filtering. The engine's World groups are anisotropic with POINT mip
; filtering, which steps between mip levels; TF_Trilinear on the texture is not anisotropic at all
; (Phase06 6.3).
[GlobalDefaults DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_Project01,MinLODSize=1,MaxLODSize=16384,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)
