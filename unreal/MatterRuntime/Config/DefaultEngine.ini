[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/MatterRuntime.MatterRuntimeGameMode

; Matched lighting (tools/parity/JOB_FORMAT.md): no GI, no screen-space or Lumen reflections,
; no AO, no shadows (each light also turns its own off), no auto exposure, no bloom.
[/Script/Engine.RendererSettings]
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
; the Opaque master is two calls of Epic's OpenPBR function (metalness 0 and 1) mixed by
; metalness; at the default 80 bytes/pixel Substrate flattens each call's coat into its base to
; fit, which brightens the dielectric (grey card x1.14 / 1.16 / 1.39 of Storm). At 160 both coats
; stay real layers (Phase06 6.3, run 3). Studio's masters need the same budget (P20).
r.Substrate.BytesPerPixel=160
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False
r.RayTracing=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.AntiAliasingMethod=0
r.AllowStaticLighting=False

[SystemSettings]
r.PSOPrecache.ProxyCreationStrategy=0
r.SSR.Quality=0
; the runtime's textures filter anisotropically (their group, DefaultDeviceProfiles.ini), at a
; level fixed here rather than by the scalability level (1..8): a floor seen at a grazing angle
; keeps its detail, as it does in Storm (6.3: trilinear blurred it, floor dE 3.7 vs 0.7 untextured)
r.MaxAnisotropy=16

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
