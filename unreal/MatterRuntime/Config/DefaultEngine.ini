[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/MatterRuntime.MatterRuntimeGameMode

; Matched lighting (tools/parity/JOB_FORMAT.md): no GI, no screen-space or Lumen reflections,
; no AO, no shadows (each light also turns its own off), no auto exposure, no bloom.
[/Script/Engine.RendererSettings]
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
; Substrate's default 80 bytes/pixel (Phase30 30.2). Opaque, TwoLayer, Masked and Emissive are
; Substrate's own slabs under one coat: they fit 80 and keep the coat a real layer. Hair,
; Subsurface and the two Translucent masters, one call of Epic's OpenPBR function each, draw the
; same at 80 as at 160. Over 80, Substrate parameter-blends instead of refusing, so a master
; that grows (a wired F90, say) must be read again at 80 (Phase30 T1). Studio's masters follow (P20).
r.Substrate.BytesPerPixel=80
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.GenerateMeshDistanceFields=False
r.RayTracing=False
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.AntiAliasingMethod=0
r.AllowStaticLighting=False
; Phase29 (MasterSet §Object fade): the colour pass tests a masked material's mask again. At the
; engine's default (1) the mask is tested only in the depth pre-pass and the colour pass draws where
; the depth is EQUAL, so of two copies of one character in one place (a cross-fade) the one drawn
; last paints every pixel: equal depth everywhere, whatever its own mask said.
r.EarlyZPassOnlyMaterialMasking=0

[SystemSettings]
r.PSOPrecache.ProxyCreationStrategy=0
r.SSR.Quality=0
; the runtime's textures filter anisotropically (their group, DefaultDeviceProfiles.ini), at a
; level fixed here rather than by the scalability level (1..8): a floor seen at a grazing angle
; keeps its detail, as it does in Storm (6.3: trilinear blurred it, floor dE 3.7 vs 0.7 untextured)
r.MaxAnisotropy=16

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

; Windows (editor mode on the lead's machine, 2026-11-12): D3D12 at SM6, the feature level the
; Linux runtime renders at. With no section here Windows targets SM5, and the grey card drew
; 6.7 dE2000 off Blender (Phase31 D-P31-2).
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

; shader workers capped: this machine also builds other Unreal projects (UR-F6)
[DevOptions.Shaders]
PercentageUnusedShaderCompilingThreads=75
